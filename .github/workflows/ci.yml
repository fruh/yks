name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt'ed:"; echo "$out"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build -trimpath -ldflags="-s -w" -o yks .

      - name: smoke test
        run: ./yks version
