name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt'ed:"; echo "$out"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: build
        run: go build -trimpath -ldflags="-s -w" -o yks .

      # The macOS backend loads PCSC.framework at run time (purego), so a
      # Linux box without a C toolchain must still produce a macOS binary.
      - name: cross-compile for macOS without cgo
        if: runner.os == 'Linux'
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o /dev/null .
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /dev/null .
          GOOS=darwin GOARCH=arm64 go vet ./...

      - name: smoke test
        run: ./yks version
